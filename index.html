<!DOCTYPE html><html lang="uk"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Контроль гуртожитку</title>
<script src="https://unpkg.com/html5-qrcode"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 600px;
      margin: 20px auto;
      padding: 16px;
      background: #f2f5f9;
      color: #1f2937;
    }

    h1, h2 { text-align: center; }

    .panel {
      background: white;
      padding: 16px;
      margin-bottom: 16px;
      border-radius: 14px;
      box-shadow: 0 2px 8px #00000010;
    }

    button, input {
      box-sizing: border-box;
      width: 100%;
      padding: 13px;
      margin: 6px 0;
      font-size: 16px;
      border-radius: 8px;
    }

    button {
      border: 0;
      color: white;
      background: #2457c5;
    }

    .entry { background: #18794e; }
    .exit { background: #b42318; }
    .secondary { background: #64748b; }

    #status {
      font-weight: bold;
      text-align: center;
      overflow-wrap: anywhere;
    }

    #reader { width: 100%; margin: 10px 0; overflow: hidden; border-radius: 10px; }
    #reader video { width: 100% !important; border-radius: 10px; }
    .upload-label {
      display: block;
      box-sizing: border-box;
      width: 100%;
      padding: 13px;
      margin: 8px 0;
      border-radius: 8px;
      background: #e8eefc;
      color: #1947a8;
      text-align: center;
      font-weight: bold;
      cursor: pointer;
    }
    #ticketPhoto { display: none; }

    .event {
      padding: 10px 0;
      border-bottom: 1px solid #ddd;
      overflow-wrap: anywhere;
    }

    small { color: #64748b; }
    .hint { font-size: 14px; line-height: 1.45; color: #475569; }
    select { box-sizing: border-box; width: 100%; padding: 12px; margin: 6px 0; font-size: 16px; border-radius: 8px; }
    .student { padding: 8px 0; border-bottom: 1px solid #e2e8f0; }
  </style>
<style>
  [hidden]{display:none!important}
  .row{display:flex;gap:8px}.row button{width:auto;flex:1}
  .tab{background:#94a3b8}.tab.active{background:#2457c5}
  .err{color:#b42318;font-weight:bold;text-align:center}
  body{max-width:700px}
</style>
</head>
<body>
  <h1>Контроль гуртожитку</h1>
  <div class="row">
    <button id="tabS" class="tab active" onclick="showTab('student')">Простір студента</button>
    <button id="tabT" class="tab" onclick="showTab('staff')">Простір вихователя</button>
  </div>

  <div id="studentView">
    <div class="panel" id="loginBox">
      <h2>Вхід до кабінету</h2>
      <div id="reader"></div>
      <button onclick="startScanner()">Почати сканування камерою</button>
      <label class="upload-label" for="ticketPhoto">Завантажити фото студентського</label>
      <input id="ticketPhoto" type="file" accept="image/*" capture="environment" onchange="scanPhoto(this)">
      <p class="hint">Сфотографуй студентський при хорошому освітленні: штрихкод має бути чітким, без відблисків.</p>
      <button class="secondary" onclick="stopScanner()">Зупинити камеру</button>
      <p><b>Або введи серію і номер:</b></p>
      <input id="manualCode" placeholder="Наприклад, КВ 123456">
      <button onclick="useManualCode()">Увійти</button>
    </div>
    <div class="panel" id="cabinet" hidden>
      <h2>Мій кабінет</h2>
      <p id="info"></p>
      <button class="entry" onclick="mark('Вхід')">Зареєструвати вхід</button>
      <button class="exit" onclick="mark('Вихід')">Зареєструвати вихід</button>
      <h2>Моя історія</h2>
      <div id="myHistory"></div>
      <button class="secondary" onclick="closeCabinet()">Вийти з кабінету</button>
    </div>
    <p id="status" class="panel">Натисни кнопку вище, щоб почати.</p>
  </div>

  <div id="staffView" hidden>
    <div class="panel" id="staffLogin">
      <h2>Вхід вихователя</h2>
      <input id="sEmail" type="email" placeholder="Пошта">
      <input id="sPass" type="password" placeholder="Пароль">
      <button onclick="staffLogin()">Увійти</button>
      <p id="sMsg" class="err"></p>
    </div>
    <div id="staffPanel" hidden>
      <button class="secondary" onclick="staffLogout()">Вийти</button>
      <div class="panel">
        <h2 id="formTitle">Додати студента</h2>
        <input type="hidden" id="fId">
        <input id="fName" placeholder="Прізвище, ім’я, по батькові">
        <input id="fGrp" placeholder="Група">
        <input id="fRoom" placeholder="Кімната">
        <input id="fBar" placeholder="Штрихкод студентського">
        <input id="fSerS" placeholder="Серія студентського (наприклад, КВ)">
        <input id="fSerN" placeholder="Номер студентського (наприклад, 123456)">
        <div class="row"><button onclick="saveStudent()">Зберегти</button><button class="secondary" onclick="clearForm()">Очистити</button></div>
      </div>
      <div class="panel">
        <h2>Список студентів</h2>
        <input id="search" placeholder="Пошук за прізвищем" oninput="renderStudents()">
        <div id="studentList"></div>
      </div>
      <div class="panel">
        <h2>Журнал входів і виходів</h2>
        <select id="period" onchange="loadEvents()">
          <option value="day">За сьогодні</option><option value="week">За тиждень</option><option value="month">За місяць</option>
        </select>
        <div id="eventList"></div>
        <button onclick="exportCSV()">Завантажити звіт CSV</button>
      </div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = "https://fsktogehowcsvoozhgze.supabase.co";
    const SUPABASE_KEY = "sb_publishable_DBkfYvnTUBuypfcmg8Qjlw_bg1E4KNa";
    const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let scanner = null, pendingCode = "", busy = false;
    let allStudents = [], allEvents = [];
    const $ = id => document.getElementById(id);
    const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
    const fmt = d => new Date(d).toLocaleString("uk-UA");
    const norm = v => (v || "").replace(/\s/g, "").toUpperCase();
    function setStatus(m) { $("status").textContent = m; }

    function showTab(t) {
      $("studentView").hidden = t !== "student";
      $("staffView").hidden = t !== "staff";
      $("tabS").classList.toggle("active", t === "student");
      $("tabT").classList.toggle("active", t === "staff");
      if (t === "staff") staffInit(); else stopScanner();
    }

    /* ---------- ПРОСТІР СТУДЕНТА ---------- */
    function useCode(value) {
      const v = value.trim();
      if (!v || pendingCode || busy) return;
      busy = true;
      stopScanner();
      openCabinet(v).finally(() => busy = false);
    }
    function useManualCode() {
      const v = $("manualCode").value.trim();
      if (!v) { setStatus("Спочатку введи серію і номер."); return; }
      useCode(v);
    }
    async function openCabinet(code) {
      setStatus("Перевіряємо код…");
      const { data, error } = await sb.rpc("student_cabinet", { code });
      if (error) { setStatus("Помилка зв’язку з базою. Спробуй ще раз."); return; }
      if (!data) { setStatus("Цього студентського немає у списку. Зверніться до вихователя."); return; }
      pendingCode = code;
      renderCabinet(data);
      setStatus("Код прийнято.");
    }
    function renderCabinet(d) {
      $("loginBox").hidden = true; $("cabinet").hidden = false;
      const s = d.student;
      $("info").innerHTML = `<b>${esc(s.full_name)}</b><br>Група: ${esc(s.grp || "—")} · Кімната: ${esc(s.room || "—")}`;
      $("myHistory").innerHTML = d.events.length
        ? d.events.map(e => `<div class="event"><b>${esc(e.type)}</b><br><small>${fmt(e.at)}</small></div>`).join("")
        : "<p>Записів поки немає.</p>";
    }
    async function mark(type) {
      const { error } = await sb.rpc("student_mark", { code: pendingCode, kind: type });
      if (error) { setStatus("Не вдалося зберегти запис."); return; }
      setStatus(type + " зареєстровано ✔");
      const { data } = await sb.rpc("student_cabinet", { code: pendingCode });
      if (data) renderCabinet(data);
    }
    function closeCabinet() {
      pendingCode = ""; $("cabinet").hidden = true; $("loginBox").hidden = false;
      setStatus("Натисни кнопку вище, щоб почати.");
    }

    /* ---------- СКАНЕР (без змін зі старої версії) ---------- */
    const barcodeFormats = [
      Html5QrcodeSupportedFormats.CODE_128,
      Html5QrcodeSupportedFormats.CODE_39,
      Html5QrcodeSupportedFormats.CODE_93,
      Html5QrcodeSupportedFormats.EAN_13,
      Html5QrcodeSupportedFormats.EAN_8,
      Html5QrcodeSupportedFormats.ITF,
      Html5QrcodeSupportedFormats.CODABAR,
      Html5QrcodeSupportedFormats.UPC_A,
      Html5QrcodeSupportedFormats.UPC_E
    ];

    async function startScanner() {
      if (scanner || pendingCode) {
        setStatus("Спочатку заверши поточну операцію або зупини камеру.");
        return;
      }
      if (typeof Html5Qrcode === "undefined") {
        setStatus("Не вдалося завантажити сканер. Перевір підключення до інтернету.");
        return;
      }

      setStatus("Запитуємо дозвіл на камеру…");
      scanner = new Html5Qrcode("reader", {
        formatsToSupport: barcodeFormats,
        verbose: false
      });
      try {
        await scanner.start(
          { facingMode: "environment" },
          { fps: 10, qrbox: { width: 280, height: 180 }, aspectRatio: 1.777 },
          decodedText => useCode(decodedText),
          () => {}
        );
        setStatus("Камера працює. Наведи її на штрихкод студентського.");
      } catch (error) {
        console.error("Помилка запуску камери:", error);
        scanner = null;
        setStatus("Не вдалося запустити камеру. Дозволь доступ до камери в браузері або завантаж фото студентського.");
      }
    }

    async function stopScanner() {
      if (scanner) {
        const oldScanner = scanner;
        scanner = null;
        try {
          if (oldScanner.isScanning) await oldScanner.stop();
          await oldScanner.clear();
        } catch (error) {
          console.warn("Не вдалося повністю зупинити камеру:", error);
        }
      }
    }

    async function scanPhoto(input) {
      const file = input.files && input.files[0];
      if (!file) return;

      if (pendingCode) {
        setStatus("Спочатку заверши поточну операцію входу або виходу.");
        input.value = "";
        return;
      }

      if (!file.type.startsWith("image/")) {
        setStatus("Будь ласка, вибери файл із фотографією.");
        input.value = "";
        return;
      }

      stopScanner();
      setStatus("Обробляємо фото та шукаємо штрихкод…");

      if (typeof Html5Qrcode === "undefined") {
        setStatus("Не вдалося завантажити модуль сканування. Перевір підключення до інтернету та онови сторінку.");
        input.value = "";
        return;
      }

      const reader = new Html5Qrcode("reader", {
        formatsToSupport: barcodeFormats,
        verbose: false
      });

      let bitmap = null;

      function canvasBlob(canvas) {
        return new Promise((resolve, reject) => {
          canvas.toBlob(blob => {
            if (blob) resolve(blob);
            else reject(new Error("Не вдалося підготувати зображення."));
          }, "image/jpeg", 0.98);
        });
      }

      async function scanCanvas(canvas) {
        // Збільшуємо невеликі ділянки: це допомагає з вузькими штрихкодами.
        const enlarged = document.createElement("canvas");
        const scale = Math.max(1, Math.min(3, 1400 / Math.max(canvas.width, canvas.height)));
        enlarged.width = Math.round(canvas.width * scale);
        enlarged.height = Math.round(canvas.height * scale);
        const ctx = enlarged.getContext("2d");
        if (!ctx) throw new Error("Не вдалося обробити зображення.");
        ctx.imageSmoothingEnabled = false;
        ctx.drawImage(canvas, 0, 0, enlarged.width, enlarged.height);
        return await reader.scanFile(await canvasBlob(enlarged), false);
      }

      function makeRotatedCanvas(source, angle) {
        const sideways = angle === 90 || angle === 270;
        const canvas = document.createElement("canvas");
        canvas.width = sideways ? source.height : source.width;
        canvas.height = sideways ? source.width : source.height;
        const ctx = canvas.getContext("2d");
        if (!ctx) throw new Error("Не вдалося обробити зображення.");
        ctx.translate(canvas.width / 2, canvas.height / 2);
        ctx.rotate(angle * Math.PI / 180);
        ctx.drawImage(source, -source.width / 2, -source.height / 2);
        return canvas;
      }

      function cropCanvas(source, x, y, width, height) {
        const crop = document.createElement("canvas");
        crop.width = Math.max(1, Math.round(width));
        crop.height = Math.max(1, Math.round(height));
        const ctx = crop.getContext("2d");
        if (!ctx) throw new Error("Не вдалося вирізати штрихкод.");
        ctx.drawImage(source, x, y, width, height, 0, 0, crop.width, crop.height);
        return crop;
      }

      try {
        bitmap = await createImageBitmap(file);
        let result = "";

        // Перевіряємо повне фото в чотирьох орієнтаціях.
        for (const angle of [0, 90, 270, 180]) {
          const oriented = makeRotatedCanvas(bitmap, angle);
          try {
            result = await scanCanvas(oriented);
            if (result) break;
          } catch (_) {}

          // Додатково перевіряємо вузькі ділянки з усіх чотирьох боків.
          const w = oriented.width;
          const h = oriented.height;
          const crops = [
            cropCanvas(oriented, 0, 0, w * 0.42, h),
            cropCanvas(oriented, w * 0.58, 0, w * 0.42, h),
            cropCanvas(oriented, 0, 0, w, h * 0.42),
            cropCanvas(oriented, 0, h * 0.58, w, h * 0.42),
            cropCanvas(oriented, w * 0.2, h * 0.2, w * 0.6, h * 0.6)
          ];

          for (const crop of crops) {
            try {
              result = await scanCanvas(crop);
              if (result) break;
            } catch (_) {}
          }
          if (result) break;
        }

        if (result) {
          useCode(result);
        } else {
          setStatus("Штрихкод не вдалося розпізнати автоматично. Спробуй обрізати фото так, щоб у кадрі був переважно штрихкод, або введи серію та номер вручну.");
        }
      } catch (error) {
        console.error("Помилка розпізнавання фото:", error);
        setStatus("Не вдалося обробити фото. Спробуй вибрати інше зображення або введи серію та номер вручну.");
      } finally {
        if (bitmap) bitmap.close();
        input.value = "";
        try { await reader.clear(); } catch (_) {}
      }
    }


    /* ---------- ПРОСТІР ВИХОВАТЕЛЯ ---------- */
    async function staffLogin() {
      const { error } = await sb.auth.signInWithPassword({ email: $("sEmail").value.trim(), password: $("sPass").value });
      if (error) { $("sMsg").textContent = "Неправильна пошта або пароль."; return; }
      staffInit();
    }
    async function staffInit() {
      const { data: { session } } = await sb.auth.getSession();
      if (!session) { $("staffLogin").hidden = false; $("staffPanel").hidden = true; return; }
      const { data } = await sb.from("educators").select("user_id").maybeSingle();
      if (!data) {
        await sb.auth.signOut();
        $("sMsg").textContent = "Цей акаунт не має прав вихователя.";
        $("staffLogin").hidden = false; $("staffPanel").hidden = true; return;
      }
      $("sMsg").textContent = ""; $("sPass").value = "";
      $("staffLogin").hidden = true; $("staffPanel").hidden = false;
      loadStudents(); loadEvents();
    }
    async function staffLogout() { await sb.auth.signOut(); staffInit(); }

    async function loadStudents() {
      const { data, error } = await sb.from("students").select("*").order("full_name");
      if (error) { alert("Помилка: " + error.message); return; }
      allStudents = data; renderStudents();
    }
    function renderStudents() {
      const q = $("search").value.trim().toLowerCase();
      const list = allStudents.filter(s => s.full_name.toLowerCase().includes(q));
      $("studentList").innerHTML = list.map(s => `<div class="student"><b>${esc(s.full_name)}</b><br>
        <small>Група: ${esc(s.group_name || "—")} · Кімната: ${esc(s.room_number || "—")} · Код: ${s.barcode_value || s.ticket_series || s.ticket_number ? "є" : "немає"}</small>
        <div class="row"><button class="secondary" onclick="editStudent('${s.id}')">Редагувати</button><button class="exit" onclick="deleteStudent('${s.id}')">Видалити</button></div></div>`).join("") || "<p>Нікого не знайдено.</p>";
    }
    function editStudent(id) {
      const s = allStudents.find(x => x.id === id);
      $("fId").value = id; $("fName").value = s.full_name;
      $("fGrp").value = s.group_name || ""; $("fRoom").value = s.room_number || "";
      $("fBar").value = s.barcode_value || ""; $("fSerS").value = s.ticket_series || ""; $("fSerN").value = s.ticket_number || "";
      $("formTitle").textContent = "Редагування студента";
      window.scrollTo({ top: 0, behavior: "smooth" });
    }
    function clearForm() {
      ["fId","fName","fGrp","fRoom","fBar","fSerS","fSerN"].forEach(i => $(i).value = "");
      $("formTitle").textContent = "Додати студента";
    }
    async function saveStudent() {
      const v = i => $(i).value.trim() || null;
      const rec = { full_name: $("fName").value.trim(), group_name: v("fGrp"), room_number: v("fRoom"),
        barcode_value: v("fBar"), ticket_series: v("fSerS"), ticket_number: v("fSerN") };
      if (!rec.full_name) { alert("Вкажи прізвище та ім’я."); return; }
      const id = $("fId").value;
      const { error } = id ? await sb.from("students").update(rec).eq("id", id) : await sb.from("students").insert(rec);
      if (error) { alert(error.code === "23505" ? "Такий код уже є в іншого студента." : "Помилка: " + error.message); return; }
      clearForm(); loadStudents();
    }
    async function deleteStudent(id) {
      if (!confirm("Видалити студента разом з усіма його записами?")) return;
      const { error } = await sb.from("students").delete().eq("id", id);
      if (error) alert("Помилка: " + error.message);
      loadStudents(); loadEvents();
    }

    async function loadEvents() {
      const days = { day: 1, week: 7, month: 30 }[$("period").value];
      const since = new Date(); since.setHours(0, 0, 0, 0); since.setDate(since.getDate() - (days - 1));
      const { data, error } = await sb.from("events").select("id,event_type,event_time,students(full_name,group_name,room_number)")
        .gte("event_time", since.toISOString()).order("event_time", { ascending: false });
      if (error) { alert("Помилка: " + error.message); return; }
      allEvents = data;
      $("eventList").innerHTML = data.map(e => `<div class="event"><b>${esc(e.students?.full_name)}</b> — ${esc(e.event_type)}<br>
        <small>${fmt(e.event_time)}</small>
        <div class="row"><button class="secondary" onclick="flipEvent('${e.id}','${e.event_type}')">Змінити тип</button><button class="exit" onclick="deleteEvent('${e.id}')">Видалити</button></div></div>`).join("") || "<p>За цей період записів немає.</p>";
    }
    async function flipEvent(id, type) {
      await sb.from("events").update({ event_type: type === "Вхід" ? "Вихід" : "Вхід" }).eq("id", id); loadEvents();
    }
    async function deleteEvent(id) {
      if (!confirm("Видалити цей запис?")) return;
      await sb.from("events").delete().eq("id", id); loadEvents();
    }
    function exportCSV() {
      if (!allEvents.length) { alert("Журнал порожній."); return; }
      const rows = [["Дата і час", "Студент", "Група", "Кімната", "Подія"],
        ...allEvents.map(e => [fmt(e.event_time), e.students?.full_name || "", e.students?.group_name || "", e.students?.room_number || "", e.event_type])];
      const csv = "\uFEFF" + rows.map(r => r.map(v => '"' + String(v).replace(/"/g, '""') + '"').join(";")).join("\r\n");
      const a = document.createElement("a");
      a.href = URL.createObjectURL(new Blob([csv], { type: "text/csv;charset=utf-8;" }));
      a.download = "zhurnal_gurtozhytku.csv"; a.click();
    }
  </script>
</body>
</html>
